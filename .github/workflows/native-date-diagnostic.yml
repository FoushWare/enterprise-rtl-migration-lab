name: Native date regional A/B diagnostic (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [A, B, C, D]
    env:
      REGION_AB_APPROVED: ephemeral-runner-only
    steps:
      - name: Checkout investigated revision without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: FoushWare/enterprise-rtl-migration-lab
          ref: 8041f4c9c4411adb0247c3061727086c9d0735b7
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize temporary diagnostic paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'DATE_PROBE_OUTPUT=%s\n' "$RUNNER_TEMP/native-date-diagnostic" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/native-date-browsers" >> "$GITHUB_ENV"

      - name: Snapshot and apply one regional intervention (ephemeral runner only)
        env:
          REGION_CASE: ${{ matrix.case }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATE_PROBE_OUTPUT"
          cat > "$RUNNER_TEMP/read-native-locale.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          int main(void) {
            @autoreleasepool {
              NSUserDefaults *defaults = NSUserDefaults.standardUserDefaults;
              NSLocale *locale = NSLocale.currentLocale;
              NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
              formatter.locale = locale;
              formatter.dateStyle = NSDateFormatterShortStyle;
              formatter.timeStyle = NSDateFormatterNoStyle;
              formatter.timeZone = [NSTimeZone timeZoneWithAbbreviation:@"UTC"];
              formatter.calendar = [[NSCalendar alloc] initWithCalendarIdentifier:NSCalendarIdentifierGregorian];
              NSMutableDictionary *result = [NSMutableDictionary dictionary];
              for (NSString *key in @[@"AppleLocale", @"AppleLanguages", @"AppleICUDateFormatStrings"]) {
                result[key] = [defaults objectForKey:key] ?: NSNull.null;
              }
              result[@"currentLocale"] = locale.localeIdentifier;
              result[@"preferredLanguages"] = NSLocale.preferredLanguages;
              result[@"shortDatePattern"] = formatter.dateFormat;
              result[@"measurementScope"] = @"Fresh Foundation helper process; not direct inspection of Chromium renderer memory";
              NSData *json = [NSJSONSerialization dataWithJSONObject:result options:NSJSONWritingPrettyPrinted error:nil];
              fwrite(json.bytes, 1, json.length, stdout);
              printf("\n");
            }
            return 0;
          }
          OBJC
          cat > "$RUNNER_TEMP/regional-preferences.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          import sys

          # Never execute preference mutation on a developer machine or self-hosted runner.
          if not (sys.platform == 'darwin' and os.environ.get('GITHUB_ACTIONS') == 'true'
                  and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
                  and os.environ.get('REGION_AB_APPROVED') == 'ephemeral-runner-only'):
              raise SystemExit('Hosted-runner-only guard refused execution; no preferences written')

          output = Path(os.environ['DATE_PROBE_OUTPUT'])
          output.mkdir(parents=True, exist_ok=True)
          file = output / 'original-selected-settings.json'
          keys = ['AppleLocale', 'AppleLanguages', 'AppleICUDateFormatStrings']
          locale_keys = ['LANG', 'LC_ALL', 'LC_COLLATE', 'LC_CTYPE', 'LC_MESSAGES', 'LC_MONETARY', 'LC_NUMERIC', 'LC_TIME']

          def all_settings():
              raw = subprocess.check_output(['defaults', 'export', 'NSGlobalDomain', '-'])
              return plistlib.loads(raw)

          def settings():
              values = all_settings()
              return {key: {'present': key in values, 'value': values.get(key)} for key in keys}

          def other_preferences_digest():
              values = {key: value for key, value in all_settings().items() if key not in keys}
              return hashlib.sha256(plistlib.dumps(values, sort_keys=True)).hexdigest()

          def write_key(key, entry):
              if not entry['present']:
                  now = settings()
                  if now[key]['present']:
                      subprocess.run(['defaults', 'delete', 'NSGlobalDomain', key], check=True)
              elif key == 'AppleLocale' and isinstance(entry['value'], str):
                  subprocess.run(['defaults', 'write', 'NSGlobalDomain', key, '-string', entry['value']], check=True)
              elif key == 'AppleLanguages' and isinstance(entry['value'], list) and all(isinstance(x, str) for x in entry['value']):
                  subprocess.run(['defaults', 'write', 'NSGlobalDomain', key, '-array', *entry['value']], check=True)
              else:
                  raise SystemExit('Unsupported original preference type; stop before mutation')

          action = sys.argv[1]
          if action == 'snapshot':
              if file.exists():
                  raise SystemExit('Original settings already recorded; refusing overwrite')
              state = settings()
              if state['AppleLocale'] != {'present': True, 'value': 'en_US'} or state['AppleLanguages'] != {'present': True, 'value': ['en-US']}:
                  raise SystemExit('Unexpected CI baseline preferences; experiment invalid')
              if state['AppleICUDateFormatStrings']['present']:
                  raise SystemExit('Unexpected date-format override; experiment invalid')
              system = {
                  'macOS': subprocess.check_output(['sw_vers', '-productVersion'], text=True).strip(),
                  'build': subprocess.check_output(['sw_vers', '-buildVersion'], text=True).strip(),
                  'arch': subprocess.check_output(['uname', '-m'], text=True).strip(),
                  'runnerImage': os.environ.get('ImageOS'),
                  'runnerImageVersion': os.environ.get('ImageVersion')
              }
              if (system['macOS'], system['build'], system['arch']) != ('26.6.2', '25G83', 'arm64'):
                  raise SystemExit('Runner OS changed; no cross-case causal comparison allowed')
              shell = {key: os.environ.get(key) for key in locale_keys}
              if any(value not in (None, 'en_US.UTF-8') for value in shell.values()):
                  raise SystemExit('Unexpected baseline shell locale; experiment invalid')
              lock_hash = hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest()
              file.write_text(json.dumps({'preferences': state, 'shell': shell, 'system': system, 'lockDigest': lock_hash, 'otherPreferencesDigest': other_preferences_digest()}, indent=2))
          elif action == 'apply':
              original = json.loads(file.read_text())
              if settings() != original['preferences']:
                  raise SystemExit('Preferences changed before intervention')
              if other_preferences_digest() != original['otherPreferencesDigest']:
                  raise SystemExit('Other global preferences changed before intervention')
              case = os.environ['REGION_CASE']
              if case not in ['A', 'B', 'C', 'D']:
                  raise SystemExit('Unknown case')
              expected = json.loads(json.dumps(original['preferences']))
              if case == 'B':
                  expected['AppleLocale'] = {'present': True, 'value': 'en_EG'}
                  write_key('AppleLocale', expected['AppleLocale'])
              if case == 'C':
                  expected['AppleLanguages'] = {'present': True, 'value': ['en-EG', 'ar-EG']}
                  write_key('AppleLanguages', expected['AppleLanguages'])
              if settings() != expected:
                  raise SystemExit('Selected preference readback differs from requested intervention')
              expected_shell = dict(original['shell'])
              if case == 'D':
                  expected_shell = {key: 'C.UTF-8' for key in locale_keys}
                  with open(os.environ['GITHUB_ENV'], 'a') as stream:
                      for key, value in expected_shell.items():
                          stream.write(key + '=' + value + '\n')
              (output / 'intervention.json').write_text(json.dumps({'case': case, 'expectedPreferences': expected, 'expectedShell': expected_shell}, indent=2))
          elif action == 'verify':
              expected = json.loads((output / 'intervention.json').read_text())
              helper = json.loads((output / 'effective-native.json').read_text())
              actual = settings()
              original = json.loads(file.read_text())
              if other_preferences_digest() != original['otherPreferencesDigest']:
                  raise SystemExit('Other global preferences changed; causal comparison invalid')
              if actual != expected['expectedPreferences']:
                  raise SystemExit('Preference readback changed before browser launch')
              for key in keys:
                  if helper[key] != actual[key]['value']:
                      raise SystemExit('Foundation effective preference mismatch: ' + key)
              if {key: os.environ.get(key) for key in locale_keys} != expected['expectedShell']:
                  raise SystemExit('Effective child-process shell locale differs')
          elif action == 'restore':
              if not file.exists():
                  print('Snapshot absent; no intervention could start')
                  raise SystemExit(0)
              original = json.loads(file.read_text())
              changed = settings()
              for key in ['AppleLocale', 'AppleLanguages']:
                  if changed[key] != original['preferences'][key]:
                      write_key(key, original['preferences'][key])
              if settings() != original['preferences']:
                  raise SystemExit('Original selected preferences not restored')
              if other_preferences_digest() != original['otherPreferencesDigest']:
                  raise SystemExit('Unrelated global preference change; report instead of restoring broadly')
              env = dict(os.environ)
              for key, value in original['shell'].items():
                  if value is None:
                      env.pop(key, None)
                  else:
                      env[key] = value
              helper = subprocess.check_output([os.environ['RUNNER_TEMP'] + '/read-native-locale'], env=env, text=True)
              (output / 'restored-native.json').write_text(helper)
              before_helper = json.loads((output / 'before-native.json').read_text())
              if json.loads(helper) != before_helper:
                  raise SystemExit('Fresh restored Foundation readback differs from baseline')
              (output / 'restoration.json').write_text(json.dumps({'selectedPreferencesRestored': True, 'verificationShell': original['shell'], 'scope': 'Runner user NSGlobalDomain selected keys; fresh verification child uses original shell. Job VM is discarded.'}, indent=2))
          else:
              raise SystemExit('Unknown action')
          PY
          xcrun clang -fobjc-arc -framework Foundation "$RUNNER_TEMP/read-native-locale.m" -o "$RUNNER_TEMP/read-native-locale"
          python3 "$RUNNER_TEMP/regional-preferences.py" snapshot
          "$RUNNER_TEMP/read-native-locale" > "$DATE_PROBE_OUTPUT/before-native.json"
          python3 "$RUNNER_TEMP/regional-preferences.py" apply

      - name: Record selected environment details (no environment dump)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATE_PROBE_OUTPUT"
          {
            sw_vers
            printf '\nArchitecture\n'
            uname -m
            for key in AppleLocale AppleLanguages AppleICUDateFormatStrings; do
              printf '\n%s\n' "$key"
              if ! defaults read -g "$key"; then
                printf 'Preference unavailable; no default value inferred.\n'
              fi
            done
            printf '\nShell locale\n'
            locale
            printf '\nNode and npm\n'
            node --version
            npm --version
            printf '\nChecked-out revision\n'
            git rev-parse HEAD
          } > "$DATE_PROBE_OUTPUT/environment.txt" 2>&1

      - name: Install locked tools without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node -e 'if (require("playwright/package.json").version !== "1.64.0") throw new Error("Unexpected Playwright version")'
          ./node_modules/.bin/playwright install chromium --no-shell

      - name: Verify effective child preferences before fresh browser launch
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/read-native-locale" > "$DATE_PROBE_OUTPUT/effective-native.json"
          python3 "$RUNNER_TEMP/regional-preferences.py" verify

      - name: Probe native controls without application or baseline execution
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/native-date-probe.mjs" <<'JS'
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';
          const require = createRequire(process.cwd() + '/package.json');
          const { chromium } = require('playwright');
          const { PNG } = require(path.join(path.dirname(require.resolve('playwright-core/package.json')), 'lib/utilsBundle.js'));
          const output = process.env.DATE_PROBE_OUTPUT;
          if (!output || !path.isAbsolute(output)) throw new Error('Absolute temporary output path required');
          fs.mkdirSync(output, { recursive: true });
          const browser = await chromium.launch({ channel: 'chromium', headless: true, args: ['--enable-automation'] });
          try {
            if (browser.version() !== '156.0.8078.4') throw new Error('Unexpected browser version: ' + browser.version());
            const context = await browser.newContext({ locale: 'en-US', timezoneId: 'UTC', viewport: { width: 1440, height: 1000 }, colorScheme: 'light' });
            let blockedRequests = 0;
            await context.route('**/*', route => { blockedRequests++; return route.abort(); });
            const page = await context.newPage();
            await page.setContent('<html lang="en" dir="ltr"><style>input{font:16px Arial;width:250px;padding:12px;margin:20px}</style><label>Invoice date<input type="date" value="2026-10-11"></label><label>Due date<input type="date" value="2026-11-10"></label></html>');
            await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
            await page.waitForTimeout(500);
            const session = await context.newCDPSession(page);
            const rendered = [];
            let segmentInspectionError = null;
            function text(node) {
              return (node.nodeName === '#text' ? node.nodeValue : '') + [...(node.children || []), ...(node.shadowRoots || [])].map(text).join('');
            }
            function walk(node) {
              if (node.nodeName === 'INPUT') rendered.push(text(node));
              for (const child of [...(node.children || []), ...(node.shadowRoots || [])]) walk(child);
            }
            try {
              walk((await session.send('DOM.getDocument', { depth: -1, pierce: true })).root);
            } catch (error) {
              segmentInspectionError = error.message;
            }
            const rawArguments = (await session.send('Browser.getBrowserCommandLine')).arguments;
            const executablePath = rawArguments[0];
            const allowedPrefixes = ['--disable-', '--enable-', '--headless', '--hide-scrollbars', '--mute-audio', '--blink-settings=', '--force-color-profile=', '--lang=', '--no-', '--remote-debugging-pipe', '--use-mock-keychain', '--password-store=basic', '--metrics-recording-only', '--allow-pre-commit-input', '--export-tagged-pdf'];
            const launchArguments = rawArguments.slice(1).filter(argument => allowedPrefixes.some(prefix => argument.startsWith(prefix)));
            function inspectPng(file) {
              const png = PNG.sync.read(fs.readFileSync(file));
              let meaningfulPixels = 0;
              for (let i = 0; i < png.data.length; i += 4) {
                const [r, g, b, a] = png.data.subarray(i, i + 4);
                if (a && !(r === 255 && g === 255 && b === 255) && !(r === 0 && g === 0 && b === 0)) meaningfulPixels++;
              }
              return { file: path.basename(file), width: png.width, height: png.height, meaningfulPixels, nonblank: meaningfulPixels > 100 };
            }
            const screenshots = [];
            const screenshotErrors = [];
            try {
              await page.screenshot({ path: output + '/surface.png' });
              screenshots.push(inspectPng(output + '/surface.png'));
            } catch (error) { screenshotErrors.push({ capture: 'surface', message: error.message }); }
            try {
              const capture = await session.send('Page.captureScreenshot', { format: 'png', fromSurface: false });
              fs.writeFileSync(output + '/visible.png', Buffer.from(capture.data, 'base64'));
              screenshots.push(inspectPng(output + '/visible.png'));
            } catch (error) { screenshotErrors.push({ capture: 'visible', message: error.message }); }
            const pageState = await page.evaluate(() => ({
              browserLocale: navigator.language,
              documentLanguage: document.documentElement.lang,
              documentDirection: document.documentElement.dir,
              timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
              viewport: { width: innerWidth, height: innerHeight },
              devicePixelRatio,
              inputs: [...document.querySelectorAll('input')].map(input => ({ value: input.value, bounds: input.getBoundingClientRect().toJSON() }))
            }));
            const result = { browserVersion: browser.version(), executablePath, launchArguments, omittedArgumentCount: rawArguments.length - 1 - launchArguments.length, requestedLocale: 'en-US', requestedTimezone: 'UTC', pageState, nativeSegments: rendered, segmentInspectionError, screenshots, screenshotErrors, blockedRequests, visualOrdering: 'Requires human inspection of nonblank screenshots; ISO values are not presentation evidence.' };
            fs.writeFileSync(output + '/probe.json', JSON.stringify(result, null, 2));
            fs.writeFileSync(output + '/comparison.md', [
              '# Native date diagnostic',
              'Local reference: Chrome 155.0.8059.40 and Chrome for Testing 156.0.8078.4 both displayed 11/10/2026 and 10/11/2026 under AppleLocale=en_EG.',
              'Original CI screenshots displayed 10/11/2026 and 11/10/2026; its regional preferences were not recorded.',
              'Current native segments: ' + JSON.stringify(rendered),
              'Compare environment.txt and probe.json, then inspect nonblank screenshots. A nonblank flag alone does not prove readable date glyphs.',
              'The visible fallback can contain browser-window surroundings and may not have viewport-sized dimensions.',
              'This isolated fixture does not establish production application compatibility or authorize remediation.'
            ].join('\n\n') + '\n');
            if (!screenshots.some(screenshot => screenshot.nonblank)) throw new Error('No meaningful screenshot evidence; diagnostic incomplete');
          } finally {
            await browser.close();
          }
          JS
          node --check "$RUNNER_TEMP/native-date-probe.mjs"
          node "$RUNNER_TEMP/native-date-probe.mjs"

      - name: Check settings stayed controlled through browser execution
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/regional-preferences.py" verify

      - name: Restore original selected runner preferences
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/regional-preferences.py" ]]; then
            python3 "$RUNNER_TEMP/regional-preferences.py" restore
          fi

      - name: Confirm tracked checkout remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain --untracked-files=all > "$DATE_PROBE_OUTPUT/checkout-status.txt"
          test ! -s "$DATE_PROBE_OUTPUT/checkout-status.txt"

      - name: Upload only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-date-regional-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/native-date-diagnostic/environment.txt
            ${{ runner.temp }}/native-date-diagnostic/original-selected-settings.json
            ${{ runner.temp }}/native-date-diagnostic/intervention.json
            ${{ runner.temp }}/native-date-diagnostic/before-native.json
            ${{ runner.temp }}/native-date-diagnostic/effective-native.json
            ${{ runner.temp }}/native-date-diagnostic/restored-native.json
            ${{ runner.temp }}/native-date-diagnostic/restoration.json
            ${{ runner.temp }}/native-date-diagnostic/probe.json
            ${{ runner.temp }}/native-date-diagnostic/comparison.md
            ${{ runner.temp }}/native-date-diagnostic/surface.png
            ${{ runner.temp }}/native-date-diagnostic/visible.png
            ${{ runner.temp }}/native-date-diagnostic/checkout-status.txt
          retention-days: 3
          if-no-files-found: error
