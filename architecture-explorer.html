 const section=document.createElement('details');section.id='command-lab';section.innerHTML=`<summary>${t('الكوماند بيعمل إيه؟ جرّبه وتتبّع الرحلة','What does the command do? Try it and follow the flow')}</summary><p>${t('الأمر ده يشغّل الرحلة كاملة في التيرمنال. الأزرار هنا بتعرض تسجيل متحقق منه، مش بتشغّل Node داخل المتصفح.','This command runs the whole pipeline in your terminal. These buttons replay verified data; they do not execute Node in the browser.')}</p>${code('npm run rtl:scan -- --root "$DEMO_ROOT" --format json')}<details><summary>${t('أول مرة؟ انسخ تجهيز المثال وتشغيله كامل','First time? Copy the complete fixture setup and run')}</summary><p>${t('من مجلد المشروع بعد تثبيت اعتمادياته. الملف الأصلي من الكوميت المثبت؛ الملفات المؤقتة خارج المشروع. المثال كله 6 أدلة و3 ملاحظات، مش فحص التطبيق الكامل.','Run from the repository root with dependencies installed. Uses the pinned committed fixture and temporary files outside the repository. This fixture has 6 facts and 3 findings; it is not the full application scan.')}</p>${code(recipe)}<button id="copy-fixture">${t('انسخ الأوامر','Copy commands')}</button></details><button id="command-start">${t('اعرض التشغيل المسجّل','Replay verified run')}</button><div id="command-flow" aria-label="${t('مسار التنفيذ','Execution flow')}"></div><div id="command-notice" role="status" aria-live="polite"></div><div id="command-detail"></div><div class="row"><button id="command-prev">${t('السابق','Previous')}</button><button id="command-next">${t('التالي','Next')}</button></div><details><summary>${t('أوامر إضافية: فحص المشروع والاختبارات','More commands: project scan and tests')}</summary>${code('npm run rtl:scan -- --format json\nnpm run rtl:scan -- --format markdown\nnpm run rtl:scan:test\nnpm run rtl:scan:typecheck')}<p>${t('أوامر المشروع تفحص apps وlibs الحالية؛ أرقامها تختلف عن المثال. خيار --fail-on-findings يرجع 1 عند وجود ملاحظات actionable، و2 عند فحص غير مكتمل. لا يصلح الملفات.','Project commands scan current apps and libs, so counts differ from the fixture. --fail-on-findings returns 1 for actionable findings and 2 for an incomplete scan. It does not fix files.')}</p></details>`;
 root.insertBefore(section,root.querySelector('.sg-nav'));
 function paint(){const s=steps[active],f=m.functions.find(f=>f.name===s[1]&&f.path.endsWith('/'+s[0]));let calls=m.events.filter(e=>e.event==='enter'&&e.id===f?.id),enter=active===4?calls.at(-1):calls[0],ret=enter&&m.events.find(e=>e.event==='return'&&e.call===enter.call);let input=enter?.args,output=ret?.value;
 if(active===0){input={argv:['--root','<temporary fixture root>','--format','json']};output={calls:'scan(root)',format:'json'};}
 if(active===1)output=ret?.sideEffects||output;
 if(active===5){input={evidence:r.report.evidence.length,findings:r.report.findings.length,complete:r.report.complete};output={stdout:'JSON report',exitCode:m.exitCode};}
 $('#command-flow').innerHTML=steps.map((x,i)=>(i?'<span aria-hidden="true">→</span>':'')+`<button data-command-node="${i}" aria-current="${i===active?'step':'false'}">${i+1}. ${esc(x[1]||'CLI')}</button>`).join('');
 $('#command-notice').textContent=t('إنت هنا: ','You are here: ')+(active+1)+' / '+steps.length+' — '+s[2];
 const file=m.files.find(x=>x.name===s[0]);const src=f?.code||file?.source;
 $('#command-detail').innerHTML=`<h3><bdi>${esc(s[2])}</bdi></h3><p>${esc(s[3][ar?0:1])}</p><a target="_blank" rel="noopener" href="https://github.com/FoushWare/enterprise-rtl-migration-lab/blob/${m.revision}/tools/rtl-scanner/src/${s[0]}#L${f?.line||1}"><bdi>src/${s[0]}:${f?.line||1}</bdi></a><p>${active===0||active===5?t('المسار موثّق من المصدر؛ النتيجة النهائية مطابقة لتشغيل CLI الحقيقي.','Source-verified path; final result matches real CLI execution.'):t('المدخلات والنتيجة من الاستدعاء المسجّل.','Inputs and result from the recorded call.')}</p><h4>${t('المدخلات','Inputs')}</h4>${code(input)}<h4>${t('النتيجة / التأثير','Output / side effects')}</h4>${code(output)}<details><summary>${t('كود الدالة الحقيقي','Actual function source')}</summary>${code(src)}</details>`;
 $('#command-prev').disabled=active===0;$('#command-next').disabled=active===steps.length-1;
 section.querySelectorAll('[data-command-node]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.commandNode);paint()});
 }
 $('#command-start').onclick=()=>{active=0;paint()};$('#command-prev').onclick=()=>{active=Math.max(0,active-1);paint()};$('#command-next').onclick=()=>{active=Math.min(steps.length-1,active+1);paint()};
 $('#copy-fixture').onclick=async()=>{try{await navigator.clipboard.writeText(recipe);$('#command-notice').textContent=t('تم نسخ أوامر المثال. شغّلها في التيرمنال من مجلد المشروع.','Commands copied. Run them in your terminal from the repository root.')}catch{$('#command-notice').textContent=t('النسخ غير متاح هنا؛ حدّد الأوامر وانسخها يدويًا.','Clipboard unavailable here; select and copy the commands manually.')}};paint();
 }
 globalThis.addEventListener('simplelessonchange',render);render();
})();
</script></body></html>
